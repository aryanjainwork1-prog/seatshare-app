kind = "web"
previewPath = "/seatshare-web/"
title = "SeatShare Web Prototype"
version = "1.0.0"
id = "artifacts/seatshare-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/seatshare-web/" ]
localPort = 21973

[services.development]
run = "pnpm --filter @workspace/seatshare-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seatshare-web", "run", "build" ]
publicDir = "artifacts/seatshare-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21973"
BASE_PATH = "/seatshare-web/"
